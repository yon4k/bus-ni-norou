<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バスに乗ろう - Photo Map</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }
    #map {
      width: 100vw;
      height: 100vh;
    }

    /* アイコンの外枠設定（丸形） */
    .custom-pin-container {
      width: 48px !important;
      height: 48px !important;
      border-radius: 50% !important;
      overflow: hidden;
    }

    /* 丸型写真アイコンのスタイル */
    .photo-pin {
      width: 100% !important;
      height: 100% !important;
      border-radius: 50% !important;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      object-fit: cover;
      box-sizing: border-box;
      cursor: pointer;
    }

    .popup-content {
      text-align: center;
      max-width: 200px;
    }
    .popup-content img {
      width: 100%;
      height: auto;
      border-radius: 4px;
      margin-bottom: 6px;
    }
    .popup-content h4 {
      margin: 4px 0 8px 0;
      font-size: 14px;
    }
    .popup-content a {
      display: inline-block;
      padding: 6px 12px;
      background-color: #222222;
      color: #ffffff;
      text-decoration: none;
      border-radius: 4px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const map = L.map('map').setView([36.578056, 136.648056], 5);

    L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
    }).addTo(map);

    // 外部の spots.json からデータを読み込んでピンを配置
    fetch('spots.json')
      .then(response => response.json())
      .then(spots => {
        spots.forEach(spot => {
          const customIcon = L.divIcon({
            className: 'custom-pin-container',
            html: `<img src="${spot.imageUrl}" class="photo-pin" alt="preview">`,
            iconSize: [48, 48],
            iconAnchor: [24, 24]
          });

          const popupHTML = `
            <div class="popup-content">
              <img src="${spot.imageUrl}" alt="photo">
              <h4>${spot.title}</h4>
              <a href="${spot.noteUrl}" target="_blank" rel="noopener">noteで読む</a>
            </div>
          `;

          L.marker([spot.lat, spot.lng], { icon: customIcon })
            .addTo(map)
            .bindPopup(popupHTML);
        });
      })
      .catch(error => {
        console.error('spots.jsonの読み込みに失敗しました:', error);
      });
  </script>
</body>
</html>
