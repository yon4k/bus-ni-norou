<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バス乗車記録</title>
    <!-- Tailwind CSS (軽量で高速なデザイン用ライブラリ) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons (アイコン) -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Zen Kaku Gothic New -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Zen Kaku Gothic New', sans-serif;
            background-color: #f1f5f9;
        }
        .touch-active:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen pb-12">

    <!-- ヘッダー -->
    <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i data-lucide="bus" class="w-6 h-6 text-blue-400"></i>
                <h1 class="text-lg font-bold tracking-wide">バス乗車ログ</h1>
            </div>
            <button id="open-settings" class="p-2 text-slate-300 hover:text-white rounded-full hover:bg-slate-800 transition">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md mx-auto px-3 pt-4 space-y-4">

        <!-- 1. 新規登録/編集フォーム (一番上に配置) -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-4">
            <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                <h2 id="form-title" class="font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i>
                    乗車記録の登録
                </h2>
                <button id="reset-form-btn" type="button" class="hidden text-xs text-slate-500 hover:text-slate-700 bg-slate-100 px-2 py-1 rounded">
                    新規入力に戻る
                </button>
            </div>

            <form id="bus-form" class="space-y-3">
                <input type="hidden" id="entry-id" value="">

                <!-- 乗車日 & 系統番号 -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">乗車日 <span class="text-red-500">*</span></label>
                        <input type="date" id="field-date" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">系統番号</label>
                        <input type="text" id="field-line" placeholder="例: 王78" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- 事業者名 (サジェストdatalistを紐付け) -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-xs font-semibold text-slate-500">事業者名 <span class="text-red-500">*</span></label>
                        <span class="text-[10px] text-blue-600">※過去の履歴から補完</span>
                    </div>
                    <!-- list="company-suggestions" でdatalistと連携 -->
                    <input type="text" id="field-company" list="company-suggestions" placeholder="例: 都営バス, 関東バス" required class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" autocomplete="off">
                    
                    <!-- サジェスト候補リスト -->
                    <datalist id="company-suggestions">
                        <!-- JSで動的に<option>が追加されます -->
                    </datalist>

                    <!-- クイック選択タグ (直近3件のワンタップボタン) -->
                    <div id="company-quick-tags" class="flex flex-wrap gap-1.5 mt-2 hidden">
                        <!-- JSで直近3件のボタンを表示 -->
                    </div>
                </div>

                <!-- 登録番号 & 車番 -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">登録番号 (ナンバー)</label>
                        <input type="text" id="field-plate" placeholder="練馬200か1234" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">車番</label>
                        <input type="text" id="field-busno" placeholder="例: D-123" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- 乗車場所 & 降車場所 -->
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">乗車場所</label>
                        <input type="text" id="field-from" placeholder="例: 新宿駅西口" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">降車場所</label>
                        <input type="text" id="field-to" placeholder="例: 中野駅" class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <!-- 送信ボタン -->
                <button type="submit" id="submit-btn" class="w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition duration-150 flex items-center justify-center gap-2 touch-active">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span id="submit-btn-text">この内容で登録する</span>
                </button>
            </form>
        </section>

        <!-- 2. 検索・フィルター (アコーディオン化) -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <button id="toggle-search-btn" class="w-full p-3 flex justify-between items-center text-left text-xs font-bold text-slate-600 hover:bg-slate-50">
                <span class="flex items-center gap-1.5">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400"></i>
                    過去ログを検索・絞り込み
                </span>
                <i data-lucide="chevron-down" id="search-chevron" class="w-4 h-4 text-slate-400 transition-transform duration-200"></i>
            </button>
            <div id="search-container" class="hidden px-3 pb-3 pt-1 border-t border-slate-100">
                <input type="text" id="search-input" placeholder="事業者名、系統、場所、ナンバーで検索..." class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </section>

        <!-- 3. 乗車記録一覧 (直近5件 + さかのぼる) -->
        <section>
            <div class="flex justify-between items-center px-1 mb-2">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider flex items-center gap-1">
                    <i data-lucide="history" class="w-4 h-4"></i>
                    乗車履歴 <span id="record-count-badge" class="bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded-full text-[10px]">0件</span>
                </h2>
                <span id="sync-status" class="text-[11px] text-slate-400">ローカル保存中</span>
            </div>

            <!-- カードリスト領域 -->
            <div id="logs-container" class="space-y-3">
                <!-- JavaScriptでカードが動的に挿入されます -->
            </div>

            <!-- さかのぼる（さらに読み込む）ボタン -->
            <div id="load-more-container" class="mt-4 text-center hidden">
                <button id="load-more-btn" class="w-full bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 font-medium py-2.5 px-4 rounded-xl shadow-sm text-xs transition flex items-center justify-center gap-2 touch-active">
                    <i data-lucide="arrow-down-circle" class="w-4 h-4 text-blue-600"></i>
                    <span>過去の記録をさかのぼる (<span id="remaining-count">0</span>件)</span>
                </button>
            </div>
        </section>

    </main>

    <!-- 設定モーダル (GAS URL設定用) -->
    <div id="settings-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="database" class="w-5 h-5 text-blue-600"></i>
                    設定 (GAS連携)
                </h3>
                <button id="close-settings" class="text-slate-400 hover:text-slate-600">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="space-y-3 text-xs text-slate-600">
                <p>Google Apps Script (GAS) のWebアプリURLを設定すると、Googleスプレッドシートと双方向同期できます。</p>
                <div>
                    <label class="block font-semibold mb-1 text-slate-700">GAS Web App URL</label>
                    <input type="url" id="gas-url-input" placeholder="https://script.google.com/macros/s/.../exec" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-xs font-mono focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>

            <div class="flex gap-2 pt-2">
                <button id="save-settings-btn" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded-lg text-xs hover:bg-blue-700 transition">
                    保存して同期
                </button>
            </div>
        </div>
    </div>

    <!-- アプリケーションスクリプト -->
    <script>
        // --- 状態管理 ---
        let busLogs = [];
        let displayLimit = 5; // 初期表示件数（直近5件）
        let gasApiUrl = localStorage.getItem('bus_app_gas_url') || '';

        // --- 初期化 ---
        document.addEventListener('DOMContentLoaded', () => {
            // 今日の日付をセット
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('field-date').value = today;

            // URLパラメータ（クエリ）からの自動補完機能
            parseUrlParams();

            // 設定状態の読み込み
            if (gasApiUrl) {
                document.getElementById('gas-url-input').value = gasApiUrl;
                document.getElementById('sync-status').textContent = 'クラウド同期モード';
                document.getElementById('sync-status').classList.replace('text-slate-400', 'text-blue-600');
            }

            // データの読み込み
            loadLogs();

            // イベントリスナー設定
            document.getElementById('bus-form').addEventListener('submit', handleFormSubmit);
            document.getElementById('reset-form-btn').addEventListener('click', resetForm);
            document.getElementById('open-settings').addEventListener('click', () => toggleModal('settings-modal', true));
            document.getElementById('close-settings').addEventListener('click', () => toggleModal('settings-modal', false));
            document.getElementById('save-settings-btn').addEventListener('click', saveSettings);
            document.getElementById('search-input').addEventListener('input', () => { displayLimit = 5; renderLogs(); });
            document.getElementById('load-more-btn').addEventListener('click', () => { displayLimit += 5; renderLogs(); });
            
            // 検索アコーディオンの切り替え
            document.getElementById('toggle-search-btn').addEventListener('click', () => {
                const container = document.getElementById('search-container');
                const chevron = document.getElementById('search-chevron');
                container.classList.toggle('hidden');
                chevron.classList.toggle('rotate-180');
            });

            // アイコン初期化
            lucide.createIcons();
        });

        // --- URLパラメータ自動補完 ---
        function parseUrlParams() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('company')) document.getElementById('field-company').value = params.get('company');
            if (params.has('line')) document.getElementById('field-line').value = params.get('line');
            if (params.has('plate')) document.getElementById('field-plate').value = params.get('plate');
            if (params.has('busno')) document.getElementById('field-busno').value = params.get('busno');
            if (params.has('from')) document.getElementById('field-from').value = params.get('from');
            if (params.has('to')) document.getElementById('field-to').value = params.get('to');
            if (params.has('date')) document.getElementById('field-date').value = params.get('date');
        }

        // --- データロード ---
        async function loadLogs() {
            if (gasApiUrl) {
                try {
                    const res = await fetch(gasApiUrl);
                    busLogs = await res.json();
                    localStorage.setItem('bus_logs_data', JSON.stringify(busLogs));
                } catch (e) {
                    console.error('GASデータ取得失敗:', e);
                    loadLocalLogs();
                }
            } else {
                loadLocalLogs();
            }
            renderLogs();
            updateCompanySuggestions(); // 事業者名サジェストの更新
        }

        function loadLocalLogs() {
            const saved = localStorage.getItem('bus_logs_data');
            busLogs = saved ? JSON.parse(saved) : [];
        }

        // --- 事業者名のサジェスト & ワンタップボタンの生成 ---
        function updateCompanySuggestions() {
            const datalist = document.getElementById('company-suggestions');
            const quickTagsContainer = document.getElementById('company-quick-tags');
            
            datalist.innerHTML = '';
            quickTagsContainer.innerHTML = '';

            // 履歴から入力順（新しい順）でユニークな事業者名を抽出
            const uniqueCompanies = [];
            busLogs.forEach(log => {
                if (log.company && !uniqueCompanies.includes(log.company.trim())) {
                    uniqueCompanies.push(log.company.trim());
                }
            });

            // 1. datalistへすべての事業者名を追加（全履歴の補完用）
            uniqueCompanies.forEach(company => {
                const option = document.createElement('option');
                option.value = company;
                datalist.appendChild(option);
            });

            // 2. 直近の3種類をワンタップボタンとしてフォーム直下に配置
            const recentTop3 = uniqueCompanies.slice(0, 3);
            if (recentTop3.length > 0) {
                quickTagsContainer.classList.remove('hidden');
                recentTop3.forEach(company => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-700 border border-slate-200 hover:border-blue-300 text-[11px] px-2 py-1 rounded-md transition touch-active';
                    btn.textContent = `+ ${company}`;
                    btn.onclick = () => {
                        document.getElementById('field-company').value = company;
                    };
                    quickTagsContainer.appendChild(btn);
                });
            } else {
                quickTagsContainer.classList.add('hidden');
            }
        }

        // --- 画面描画（ログカード生成） ---
        function renderLogs() {
            const container = document.getElementById('logs-container');
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

            // 検索フィルタリング
            const filteredLogs = busLogs.filter(log => {
                if (!searchQuery) return true;
                return (
                    (log.company && log.company.toLowerCase().includes(searchQuery)) ||
                    (log.line && log.line.toLowerCase().includes(searchQuery)) ||
                    (log.from && log.from.toLowerCase().includes(searchQuery)) ||
                    (log.to && log.to.toLowerCase().includes(searchQuery)) ||
                    (log.plate && log.plate.toLowerCase().includes(searchQuery)) ||
                    (log.busno && log.busno.toLowerCase().includes(searchQuery))
                );
            });

            // 件数バッジ
            document.getElementById('record-count-badge').textContent = `${filteredLogs.length}件`;

            container.innerHTML = '';

            if (filteredLogs.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl p-8 text-center text-slate-400 border border-slate-200">
                        <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-2 stroke-1"></i>
                        <p class="text-xs">乗車記録がありません</p>
                    </div>
                `;
                document.getElementById('load-more-container').classList.add('hidden');
                lucide.createIcons();
                return;
            }

            // 指定件数分だけ切り出して表示 (直近5件〜)
            const visibleLogs = filteredLogs.slice(0, displayLimit);

            visibleLogs.forEach(log => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl p-4 shadow-sm border border-slate-200 hover:border-slate-300 transition";

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <span class="inline-block bg-slate-100 text-slate-700 text-[11px] font-bold px-2 py-0.5 rounded mr-1.5">
                                ${escapeHtml(log.date)}
                            </span>
                            ${log.line ? `<span class="inline-block bg-blue-50 text-blue-700 border border-blue-200 text-[11px] font-bold px-2 py-0.5 rounded">${escapeHtml(log.line)}</span>` : ''}
                        </div>
                        <div class="flex gap-1">
                            <button onclick="editLog('${log.id}')" class="p-1 text-slate-400 hover:text-blue-600 rounded">
                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteLog('${log.id}')" class="p-1 text-slate-400 hover:text-red-600 rounded">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>

                    <div class="text-base font-bold text-slate-800 mb-2">
                        ${escapeHtml(log.company)}
                    </div>

                    <!-- 区間 (乗車 -> 降車) -->
                    ${(log.from || log.to) ? `
                        <div class="bg-slate-50 p-2.5 rounded-lg mb-2.5 flex items-center text-xs text-slate-700 gap-2">
                            <span class="font-medium text-slate-900">${escapeHtml(log.from || '未指定')}</span>
                            <i data-lucide="arrow-right" class="w-3.5 h-3.5 text-slate-400 flex-shrink-0"></i>
                            <span class="font-medium text-slate-900">${escapeHtml(log.to || '未指定')}</span>
                        </div>
                    ` : ''}

                    <!-- ナンバー・車番情報 -->
                    <div class="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-500 pt-1 border-t border-slate-100">
                        ${log.plate ? `<div><span class="text-slate-400 mr-1">ナンバー:</span><span class="font-medium text-slate-700">${escapeHtml(log.plate)}</span></div>` : ''}
                        ${log.busno ? `<div><span class="text-slate-400 mr-1">車番:</span><span class="font-medium text-slate-700">${escapeHtml(log.busno)}</span></div>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });

            // さかのぼるボタンの制御
            const loadMoreContainer = document.getElementById('load-more-container');
            const remaining = filteredLogs.length - displayLimit;
            if (remaining > 0) {
                loadMoreContainer.classList.remove('hidden');
                document.getElementById('remaining-count').textContent = remaining;
            } else {
                loadMoreContainer.classList.add('hidden');
            }

            lucide.createIcons();
        }

        // --- フォーム送信 (新規作成 / 更新) ---
        async function handleFormSubmit(e) {
            e.preventDefault();

            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75');

            const id = document.getElementById('entry-id').value || 'id_' + Date.now();
            const logData = {
                id: id,
                date: document.getElementById('field-date').value,
                company: document.getElementById('field-company').value.trim(),
                line: document.getElementById('field-line').value.trim(),
                plate: document.getElementById('field-plate').value.trim(),
                busno: document.getElementById('field-busno').value.trim(),
                from: document.getElementById('field-from').value.trim(),
                to: document.getElementById('field-to').value.trim(),
                timestamp: new Date().toISOString()
            };

            const existingIndex = busLogs.findIndex(item => item.id === id);
            if (existingIndex > -1) {
                busLogs[existingIndex] = logData;
            } else {
                busLogs.unshift(logData); // 最新データを先頭に追加
            }

            // ローカル保存
            localStorage.setItem('bus_logs_data', JSON.stringify(busLogs));

            // GAS連携処理
            if (gasApiUrl) {
                try {
                    await fetch(gasApiUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'save', data: logData })
                    });
                } catch (e) {
                    console.error('GAS保存エラー:', e);
                }
            }

            resetForm();
            renderLogs();
            updateCompanySuggestions(); // 送信後にサジェストも最新に更新

            submitBtn.disabled = false;
            submitBtn.classList.remove('opacity-75');
        }

        // --- 編集モード ---
        window.editLog = function(id) {
            const log = busLogs.find(item => item.id === id);
            if (!log) return;

            document.getElementById('entry-id').value = log.id;
            document.getElementById('field-date').value = log.date;
            document.getElementById('field-company').value = log.company;
            document.getElementById('field-line').value = log.line || '';
            document.getElementById('field-plate').value = log.plate || '';
            document.getElementById('field-busno').value = log.busno || '';
            document.getElementById('field-from').value = log.from || '';
            document.getElementById('field-to').value = log.to || '';

            document.getElementById('form-title').innerHTML = `<i data-lucide="edit" class="w-5 h-5 text-amber-500"></i> 記録の編集`;
            document.getElementById('submit-btn-text').textContent = '変更内容を更新する';
            document.getElementById('submit-btn').className = 'w-full mt-2 bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition duration-150 flex items-center justify-center gap-2 touch-active';
            document.getElementById('reset-form-btn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        };

        // --- 削除 ---
        window.deleteLog = async function(id) {
            if (!confirm('この乗車記録を削除してもよろしいですか？')) return;

            busLogs = busLogs.filter(item => item.id !== id);
            localStorage.setItem('bus_logs_data', JSON.stringify(busLogs));

            if (gasApiUrl) {
                try {
                    await fetch(gasApiUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'delete', id: id })
                    });
                } catch (e) {
                    console.error('GAS削除エラー:', e);
                }
            }

            renderLogs();
            updateCompanySuggestions(); // 削除後にもサジェストを最新に更新
        };

        // --- フォームリセット ---
        function resetForm() {
            document.getElementById('bus-form').reset();
            document.getElementById('entry-id').value = '';
            document.getElementById('field-date').value = new Date().toISOString().split('T')[0];

            document.getElementById('form-title').innerHTML = `<i data-lucide="plus-circle" class="w-5 h-5 text-blue-600"></i> 乗車記録の登録`;
            document.getElementById('submit-btn-text').textContent = 'この内容で登録する';
            document.getElementById('submit-btn').className = 'w-full mt-2 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition duration-150 flex items-center justify-center gap-2 touch-active';
            document.getElementById('reset-form-btn').classList.add('hidden');

            lucide.createIcons();
        }

        // --- 設定保存 ---
        function saveSettings() {
            const url = document.getElementById('gas-url-input').value.trim();
            gasApiUrl = url;
            localStorage.setItem('bus_app_gas_url', url);

            if (url) {
                document.getElementById('sync-status').textContent = 'クラウド同期モード';
                document.getElementById('sync-status').classList.replace('text-slate-400', 'text-blue-600');
            } else {
                document.getElementById('sync-status').textContent = 'ローカル保存中';
                document.getElementById('sync-status').classList.replace('text-blue-600', 'text-slate-400');
            }

            toggleModal('settings-modal', false);
            loadLogs();
        }

        // --- モーダル表示切り替え ---
        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        // --- HTMLエスケープ ---
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
